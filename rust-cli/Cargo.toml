[package]
name = "nsfw-cli-rust"
version = "0.1.0"
edition = "2021"
description = "Modesty NSFW scanner Rust CLI - matches Python nsfw-scan behavior"
license = "MIT"

[dependencies]
nsfw-lib-rust = { path = "../nsfw-lib-rust", features = ["onnx"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"

[[bin]]
name = "nsfw-cli-rust"
path = "src/main.rs"

[features]
onnx = ["nsfw-lib-rust/onnx"]

[profile.release]
lto = true
opt-level = 3
strip = true